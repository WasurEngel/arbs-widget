<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Warframe Arbitration Overlay</title>
  <!-- CSSファイルの読み込み -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="arb-card">
    <!-- 現在の仲裁 -->
    <div class="section">
      <div class="title">Current</div>
      <div id="current-node" class="current-node">解析中...</div>
      <div class="timer-container">
        残り時間: <span id="timer" class="timer">--:--</span>
      </div>
    </div>

    <!-- 縦区切り線 -->
    <div class="divider-v"></div>

    <!-- 次の仲裁 -->
    <div class="section">
      <div class="title" style="color: #3498db;">Next</div>
      <div id="next-node" class="next-node">--</div>
    </div>
  </div>

  <!-- JavaScriptファイルの読み込み -->
  <script src="script.js"></script>
</body>
</html>
